# harness-agent-rs — Rust harness/agent-manager runtime (see docs/ADR via harness_hub ADR-0001).
# Port-in-progress from meta/Archon's runtime DESIGN, mapping subsystems onto hf/weave/grit/icm.
[workspace]
resolver = "2"
members = [
    "crates/har-core",
    "crates/har-contract",
    "crates/har-paths",
    "crates/har-git",
    "crates/har-isolation",
    "crates/har-provider",
    "crates/har-workflow-schema",
    "crates/har-ledger",
    "crates/har-coord",
    "crates/har-memory",
    "crates/har-dag-executor",
    "crates/har-orchestrator",
    "crates/har-adapters",
    "crates/har-server",
    "crates/har-cli",
    "crates/har-db",
]

[workspace.package]
edition = "2021"
license = "MIT"

# ─── Shared dependency versions ─────────────────────────────────────────────
# Pin versions here; member crates inherit via `workspace = true`.
[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "codec", "io"] }
async-trait = "0.1"

# Byte utilities
bytes = "1"

# Unix/platform syscalls
libc = "0.2"

# Streaming
futures = "0.3"
async-stream = "0.3"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP / adapters
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"

# CLI
clap = { version = "4", features = ["derive"] }

# Path utilities
directories = "5"

# Ordered maps (when insertion order matters)
indexmap = { version = "2", features = ["serde"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# JSON repair (matches npm jsonrepair's throw-on-trailing-garbage + recover-malformed behavior)
jsonrepair-rs = "0.2.1"

# JSON Schema validation — Draft-07 pinned (Ajv 8 default; port of validateStructuredOutput / WF-31)
jsonschema = "0.46"

# Regex
regex = "1"

# Lazy statics
once_cell = "1"

# Cryptography (SHA-256 short hashes for worktree branch naming)
sha2 = "0.10"
hex = "0.4"

# Random number generation (OpenCode embedded runtime: random port + password)
rand = "0.8"

# URL parsing (OpenCode runtime: extract port from embedded server URL)
url = "2"

# Futures utilities
futures-util = "0.3"

# UUID generation (TS crypto.randomUUID() → Uuid::new_v4, v4 lowercase hyphenated)
uuid = { version = "1", features = ["v4", "serde"] }

# SQL database driver (sqlx 0.9; sqlite + postgres — postgres added cycle 28 for CO-01b PostgresAdapter)
# runtime-tokio-rustls: pure-Rust TLS (no OpenSSL) on the postgres path; sqlite uses bundled C-SQLite.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "uuid", "chrono", "json", "bigdecimal"] }

# Temporary-file helpers (for test DBs)
tempfile = "3"
