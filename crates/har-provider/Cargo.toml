[package]
name = "har-provider"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "IAgentProvider impls over provider CLIs, registry with capability declarations, builtins, MCP wiring."

[dependencies]
har-contract = { path = "../har-contract" }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
futures-core = "0.3"
async-stream.workspace = true
tracing.workspace = true
indexmap.workspace = true
bytes.workspace = true
tempfile = "3"

directories.workspace = true
axum.workspace = true
tower.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Exposes test-only provider constructors (new_for_test*, UID-guard bypass + configurable
# retry delay) to integration test crates. NOT enabled in production builds.
test-util = []

[dev-dependencies]
serial_test = "3"
# Self dev-dep with test-util so integration tests can use new_for_test* constructors.
har-provider = { path = ".", features = ["test-util"] }
reqwest.workspace = true
