[package]
name = "har-git"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Git plumbing: branch ops, repo ops, worktree add/remove/list, subprocess exec helper."

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "fs", "io-util"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
har-paths = { path = "../har-paths" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "process", "fs"] }
tempfile = "3"
