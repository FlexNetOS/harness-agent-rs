[package]
name = "har-contract"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Zero-dependency provider/message contract types. Depends on serde + futures-core only."

[dependencies]
# Hard rule (providers/src/types.ts:1-3): no AI-SDK imports, no sibling crate imports.
# The original TS rule forbids SDK/sibling package imports; it does not exclude Rust stdlib
# traits. futures-core is the Stream trait (zero transitive deps); it is included because
# IAgentProvider's sendQuery return type requires it.
serde = { workspace = true }
serde_json = { workspace = true }
futures-core = "0.3"
